name: Security and Test Pipeline

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  automated-tests:
    name: Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  snyk-sca:
    name: Snyk SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Run Snyk Open Source scan
        run: snyk test --json --severity-threshold=high > snyk.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  snyk-sast:
    name: Snyk SAST
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Snyk CLI
      run: npm install --global snyk

    - name: Confirm Snyk installation
      run: snyk --version

    - name: Confirm Snyk token exists
      shell: bash
      run: |
        if [ -z "$SNYK_TOKEN" ]; then
          echo "SNYK_TOKEN is missing"
          exit 1
        fi
        echo "SNYK_TOKEN is available"
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: Run Snyk Code scan - SAST
      if: ${{ !cancelled() }}
      run: snyk code test --severity-threshold=high --debug
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}